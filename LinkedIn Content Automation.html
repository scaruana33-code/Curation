const isGate=r=>r.status==="Gate 1 Pending"||r.status==="Gate 2 Pending";
const isWorking=r=>AGENT_WORKING.includes(r.status);
const isDone=r=>r.status==="Published"||r.status.startsWith("Rejected");

function kind(r){return r.status==="Published"?"ok":r.status.startsWith("Rejected")?"bad":isGate(r)?"warn":"info";}
function due(r){const left=Math.max(0,48-(Date.now()-r.created)/HOUR);return{left,label:left<1?"<1h left":Math.floor(left)+"h left",urgent:left<12};}
function g1(r){if(r.status==="Rejected — Gate 1")return"Rejected";if(r.status==="Gate 1 Pending"||r.status==="Curating")return"Pending";return"Approved";}
function g2(r){if(r.status==="Published")return"Approved";if(r.status==="Rejected — Gate 2")return"Rejected";if(r.status==="Gate 2 Pending"||r.status==="Revising")return"Pending";return"—";}

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true;},3400);}

}
function vTask(r){
  if(r.status==="Gate 1 Pending"){
    const cards=r.articles.map(a=>`<div class="article"><h4>Article ${a.n}. ${esc(a.title)}</h4><div class="hint">${esc(a.source)} · Published ${a.date}</div><p>${esc(a.summary)}</p><a href="${a.url}" target="_blank" rel="noopener">${a.url}</a>
      <div class="actions" style="margin-top:10px"><button class="btn ok" data-act="approveArticle" data-id="${r.id}" data-n="${a.n}">Approve article ${a.n}</button></div></div>`).join('');
    return `<div class="card">${head(r)}
      <div class="notice">Gate 1 email sent to ${RECIPIENTS.join(', ')}. Pick one article to move to drafting.</div>
      ${cards}
      <label for="c-${r.id}">Comments (needed to send back for new articles)</label>
      <textarea id="c-${r.id}" placeholder="e.g. more on VMS pricing, less general hiring stats"></textarea><div class="err" id="err-${r.id}" hidden></div>
      <div class="actions">
        <button class="btn sec" data-act="sendBack" data-id="${r.id}">Send back with comments</button>
        <button class="btn badline" data-act="arm" data-id="${r.id}" id="arm-${r.id}">Reject</button>
        <span id="armrow-${r.id}" hidden><span class="hint" style="margin-right:6px">Reject and end this run?</span><button class="btn bad" data-act="reject" data-id="${r.id}">Confirm reject</button> <button class="btn sec" data-act="disarm" data-id="${r.id}">Cancel</button></span>
      </div></div>${actLog(r)}`;
  }
  if(r.status==="Gate 2 Pending"){
    const a=r.selected,n=bodyWords(r.draft);
    return `<div class="card">${head(r)}
      <div class="notice">Gate 2 email sent to ${RECIPIENTS.join(', ')}. Nothing publishes until you approve.</div>
      <h4 style="margin-bottom:6px">LinkedIn draft v${r.version||1}</h4>
      <textarea class="draftbox" id="d-${r.id}" data-draft="${r.id}" rows="22">${esc(r.draft)}</textarea>
      <div class="wc"><span id="wc-${r.id}" class="pill ${n>=150&&n<=250?'ok':'warn'}">${n} words</span><span>Target 150 to 250 words, not counting the footers. You can edit the text directly.</span></div>
      ${a?`<div class="srcline">Source article: <a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a> (${esc(a.source)})</div>`:''}
      <div class="ack"><input type="checkbox" id="ack-${r.id}" data-ack="${r.id}"><label for="ack-${r.id}">GenAI disclaimer acknowledgment. By approving, I confirm this post was reviewed against the source article and both footers are present.</label></div>
      <label for="c-${r.id}">Feedback for the agent (needed to request edits)</label>
      <textarea id="c-${r.id}" placeholder="e.g. tighten the hook, add a buyer question at the end"></textarea><div class="err" id="err-${r.id}" hidden></div>
      <div class="actions">
        <button class="btn ok" id="approve-${r.id}" data-act="publish" data-id="${r.id}" disabled>Approve &amp; publish</button>
        <button class="btn sec" data-act="saveEdits" data-id="${r.id}">Save my edits</button>
        <button class="btn sec" data-act="reqEdits" data-id="${r.id}">Request edits</button>
        <button class="btn badline" data-act="arm" data-id="${r.id}" id="arm-${r.id}">Reject</button>
        <span id="armrow-${r.id}" hidden><span class="hint" style="margin-right:6px">Reject and stop the process?</span><button class="btn bad" data-act="reject" data-id="${r.id}">Confirm reject</button> <button class="btn sec" data-act="disarm" data-id="${r.id}">Cancel</button></span>
      </div></div>${actLog(r)}`;
  }
  if(isWorking(r)){
    const w={Curating:"The agent is sourcing new articles.",Drafting:"The agent is writing the LinkedIn draft from the approved article.",Revising:"The agent is revising the draft with your feedback."}[r.status];
    return `<div class="card">${head(r)}<div class="empty">${w}<br>This page updates when the result is ready. Gate ${r.status==="Curating"?1:2} comes back to you.</div></div>${actLog(r)}`;

    return `<div class="card">${head(r)}<div class="result"><div class="mark ok">✓</div><h3>Published to LinkedIn</h3>

      <p class="hint">Confirmation sent to ${RECIPIENTS.join(', ')} by email and Teams.</p></div></div>${actLog(r)}`;
  }
  return `<div class="card">${head(r)}<div class="result"><div class="mark bad">✕</div><h3>${esc(r.status)}</h3><p class="hint" style="margin-top:6px">Alert sent to all three approvers. The run is closed.</p></div></div>${actLog(r)}`;
}

/* ---------- actions ---------- */
function later(fn,ms){setTimeout(()=>{fn();render();},ms);}
const ACTIONS={
  nav:(id,el)=>go(el.dataset.page),
  open:(id)=>{ui.selectedId=id;ui.filter='all';ui.page='todo';render();window.scrollTo(0,0);},
  select:(id)=>{ui.selectedId=id;render();},
  filter:(id,el)=>{ui.filter=el.dataset.f;ui.selectedId=null;render();},
  clear:()=>{intake.industry='';intake.topic='';intake.notes='';render();},
  submit:()=>{
    const r={id:`RUN-${String(nextId++).padStart(3,'0')}`,industry:intake.industry,topic:intake.topic,topicFull:fullTopic(intake.industry,intake.topic),audience:intake.audience,mode:intake.mode,recency:+intake.recency,style:intake.style,audited:intake.audited,publisher:intake.publisher,requestedBy:"Stephen Caruana",runDate:new Date().toISOString(),words:intake.words,hashtags:intake.hashtags,notes:intake.notes,
      status:"Curating",articles:[],selected:null,draft:"",version:0,created:Date.now(),log:[]};
    log(r,"Request submitted from Curation Intake");runs.unshift(r);ui.banner=r.id;
    intake.industry='';intake.topic='';intake.notes='';render();toast(r.id+' submitted');
    later(()=>{r.status="Gate 1 Pending";r.articles=ARTICLES;log(r,"Agent returned 3 articles. Gate 1 email sent to 3 approvers.");},900);
  },
  approveArticle:(id,el)=>{
    const r=byId(id);r.selected=r.articles.find(a=>a.n==el.dataset.n);r.status="Drafting";
    log(r,`Gate 1 approved: Article ${r.selected.n} selected`);render();toast('Article '+r.selected.n+' approved. Drafting started.');
    later(()=>{r.draft=buildPost(r.selected,r.topic,r.hashtags);r.version=1;r.status="Gate 2 Pending";log(r,"Draft v1 ready. Gate 2 email sent to 3 approvers.");},900);
  },
  sendBack:(id)=>{
    const v=$('#c-'+id).value.trim(),e=$('#err-'+id);
    if(!v){e.textContent="Add a comment so the agent knows what to change.";e.hidden=false;return;}
    const r=byId(id);r.status="Curating";log(r,"Gate 1 sent back: "+v);render();toast('Sent back to the agent');
    later(()=>{r.status="Gate 1 Pending";r.articles=ARTICLES;log(r,"New article options returned (sample results until the live agent is connected).");},900);
  },
  arm:(id)=>{$('#armrow-'+id).hidden=false;$('#arm-'+id).hidden=true;},
  disarm:(id)=>{$('#armrow-'+id).hidden=true;$('#arm-'+id).hidden=false;},
  reject:(id)=>{const r=byId(id);const g=r.status==="Gate 1 Pending"?1:2;r.status=`Rejected — Gate ${g}`;log(r,`Rejected at Gate ${g}. Alert sent, flow terminated.`);render();toast(r.id+' rejected');},
  saveEdits:(id)=>{const r=byId(id);r.draft=$('#d-'+id).value;log(r,"Draft edited by approver");render();toast('Edits saved');},
  reqEdits:(id)=>{
    const v=$('#c-'+id).value.trim(),e=$('#err-'+id);
    if(!v){e.textContent="Add feedback so the agent knows what to change.";e.hidden=false;return;}
    const r=byId(id);r.draft=$('#d-'+id).value;r.status="Revising";log(r,"Gate 2 edits requested: "+v);render();toast('Feedback sent to the agent');
    later(()=>{r.version+=1;r.status="Gate 2 Pending";log(r,`Draft v${r.version} returned (the live agent rewrites per feedback; this preview keeps your text).`);},1000);
  },
  publish:(id)=>{
    const r=byId(id);if(!$('#ack-'+id).checked)return;
    r.draft=$('#d-'+id).value;r.status="Published";r.publishedAt=Date.now();r.url=`linkedin.com/posts/scaruana_${r.id.toLowerCase()}`;
    log(r,"Gate 2 approved. Published to LinkedIn. Confirmation sent by email and Teams.");render();toast(r.id+' published');
  },
  refresh:()=>{ui.refreshed=new Date();render();toast('Dashboard refreshed from the run log');}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACTIONS[el.dataset.act];if(f)f(el.dataset.id,el);});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.ack){const b=document.getElementById('approve-'+e.target.dataset.ack);if(b)b.disabled=!e.target.checked;}});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.draft){const id=e.target.dataset.draft,n=bodyWords(e.target.value),w=document.getElementById('wc-'+id);w.textContent=n+' words';w.className='pill '+(n>=150&&n<=250?'ok':'warn');}});

/* ---------- history ---------- */
function vHistory(){
  const rows=runs.map(r=>`<tr><td class="mono">${r.id}</td><td>${esc(r.industry)}</td><td>${esc(r.topic)}</td><td>${esc(r.audience)}</td><td>${esc(r.mode)}</td><td>${g1(r)}</td><td>${g2(r)}</td><td><span class="pill ${kind(r)}">${r.status}</span></td><td class="mono">${r.url?esc(r.url):'—'}</td><td>${r.ts||fmt(r.created)}</td></tr>`).join('');
  return `<div class="page-head"><div class="crumb">Insights</div><h2>Run history</h2><p>Every run with its gate decisions, status and published link. This is the SharePoint run log the dashboard reads from.</p></div>
  <div class="card"><div class="tablewrap"><table><thead><tr><th>Run</th><th>Industry</th><th>Topic</th><th>Audience</th><th>Mode</th><th>Gate 1</th><th>Gate 2</th><th>Status</th><th>Published URL</th><th>Created</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---------- dashboard ---------- */
function vDashboard(){
  const n=runs.length,pub=runs.filter(r=>r.status==="Published").length,rej=runs.filter(r=>r.status.startsWith("Rejected")).length,pend=n-pub-rej;
  const p1=pub/n*100,p2=p1+pend/n*100,pct=x=>Math.round(x/n*100);
  const conic=`conic-gradient(var(--ok) 0 ${p1}%, var(--warn) ${p1}% ${p2}%, var(--bad) ${p2}% 100%)`;
  const mx=Math.max(...WEEKLY_VOLUME);
  const queue=runs.filter(isGate);
  return `<div class="page-head"><div class="crumb">Insights</div><h2>Power BI dashboard</h2><p>Metrics computed from the run log. Use refresh to pull the latest after approving or submitting.</p></div>
  <div class="card"><div class="actions" style="margin:0"><button class="btn sec" data-act="refresh">Refresh from run log</button><span class="hint">${ui.refreshed?'Last refreshed '+ui.refreshed.toLocaleTimeString('en-US'):'Not refreshed yet this session'}</span></div></div>
  <div class="stats">
    <div class="stat"><div class="v">${n}</div><div class="l">Total runs</div></div>
    <div class="stat"><div class="v">${pub}</div><div class="l">Published posts</div></div>
    <div class="stat"><div class="v">${pend}</div><div class="l">In progress</div></div>
    <div class="stat"><div class="v">${(rej/n*100).toFixed(1)}%</div><div class="l">Rejection rate</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Weekly run volume (example data)</h3><div class="bars">${WEEKLY_VOLUME.map((v,i)=>`<div class="b ${i===WEEKLY_VOLUME.length-1?'cur':''}" style="height:${v/mx*100}%" title="${v} runs"></div>`).join('')}</div><div class="barlab">${WEEKLY_VOLUME.map((v,i)=>`<span>W${i+1}</span>`).join('')}</div></div>
    <div class="card"><h3>Status breakdown</h3><div class="donutwrap"><div class="donut" style="background:${conic}" role="img" aria-label="Status breakdown"></div>
      <div class="legend"><div><i style="background:var(--ok)"></i>Published · ${pct(pub)}%</div><div><i style="background:var(--warn)"></i>In progress · ${pct(pend)}%</div><div><i style="background:var(--bad)"></i>Rejected · ${pct(rej)}%</div></div></div></div>
  </div>
  <div class="card"><h3>Active approval queue</h3><div class="tablewrap"><table><thead><tr><th>Run</th><th>Topic</th><th>Gate</th><th>Window</th><th></th></tr></thead><tbody>${queue.map(r=>`<tr><td class="mono">${r.id}</td><td>${esc(r.topic)}</td><td>${r.status==="Gate 1 Pending"?"Gate 1 · article selection":"Gate 2 · post approval"}</td><td>${due(r).label}</td><td><button class="btn sec" style="padding:4px 10px" data-act="open" data-id="${r.id}">Open</button></td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--ink-2)">Queue is empty.</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- reference ---------- */
function vAgent(){
  return `<div class="page-head"><div class="crumb">Reference</div><h2>News Curator agent</h2><p>Copilot Studio agent "LinkedIn Content curator gen2". It is stateless, returns structured JSON, and never controls approvals.</p></div>
  <div class="card"><h3>Role</h3><p style="color:var(--ink-2)">Receives a JSON payload from Power Automate with industry, topic, audience, recency and mode. Sources 1 to 3 credible external articles, validates every required field, and hands off. In post mode it writes a 150 to 250 word draft from the approved article only.</p>
  <div class="chips"><span>Does not control approvals</span><span>No memory between runs</span><span>Structured JSON only</span><span>Hands off to Power Automate</span></div>
  <div class="grid2"><div><h3>Article rules</h3>
    <div class="rule"><span>Volume</span><b>1 to 3 per run</b></div><div class="rule"><span>Recency</span><b>Current or prior month</b></div><div class="rule"><span>Fabrication</span><b>None, real sources only</b></div><div class="rule"><span>Required fields</span><b>Title, publisher, date, summary, URL</b></div><div class="rule"><span>Links</span><b>HTTPS only</b></div></div>
  <div><h3>Failure triggers</h3>
    <div class="rule"><span>No results</span><b>Zero matching articles</b></div><div class="rule"><span>Incomplete</span><b>Missing date or URL</b></div><div class="rule"><span>Recency</span><b>Outside current or prior month</b></div><div class="rule"><span>Action</span><b>Alert sent, flow terminated</b></div></div></div></div>
  <div class="card"><h3>Stephen Caruana voice</h3><p style="color:var(--ink-2)">Executive, strategic, NYC-confident and non-promotional. Think Judge Judy at Amazon.</p>
  <div class="chips">${["Executive","Strategic","Thought leadership","NYC confident","Direct","Quick-witted","Non-promotional","Authentic","Conversational"].map(c=>`<span>${c}</span>`).join('')}</div>
  <div class="grid2"><div><h3>Sounds like</h3><p style="color:var(--ink-2)">Mouthy and confident. No fluff. Always adds a point of view.</p></div><div><h3>Never sounds like</h3><p style="color:var(--ink-2)">"Excited to share..." or "Our solution helps..." or "Thought-provoking read!"</p></div></div>
  <div class="notice warn" style="margin:14px 0 0">Every post ends with the GenAI disclaimer and the Forward-Looking Statement.</div></div>`;
}
function vRoadmap(){
  const ph=[["Phase 1 · Now","POC complete",["Curation Intake app with cascading Industry and Topic lists","My To-Do approvals page for Gate 1 and Gate 2","Shared run log","Webhook to Power Automate"]],
    ["Phase 2 · Next","In progress",["Live Power Automate webhook","LinkedIn API publishing","Teams adaptive card approvals","SharePoint real-time sync"]],
    ["Phase 3 · Later","2027",["Multi-publisher support","A/B post variants","Engagement feedback loop","Auto-scheduling"]]];
  return `<div class="page-head"><div class="crumb">Reference</div><h2>Roadmap</h2></div><div class="grid2">${ph.map(([t,s,i])=>`<div class="card"><h3>${t}</h3><div class="hint">${s}</div><ul class="road">${i.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`;
}

render();
</script>

</body></html>
