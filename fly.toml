# Example deployment for Fly.io. Create a volume first: fly volumes create data --size 1
app = "linkedin-content-automation"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/app.db"
  PORT = "3000"
  PUBLISH_MODE = "dry-run"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
